---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.0
    hooks:
      - id: pyupgrade
        args:
          - --py39-plus
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args:
          - --fix
          - --target-version=py39
          - --extend-select=D100,D101,D102,D103
      - id: ruff-format
  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types:
          - python
        pass_filenames: true
      - id: check-perl-pod
        name: check-perl-pod
        entry: >-
          python3 -c 'import sys, re; errors = [f"{p}: missing POD section(s): {sec_str}" for p in sys.argv[1:] for c in [open(p, "r", encoding="utf-8", errors="replace").read()] for missing in [[sec for sec, reg in [("=head1 NAME", r"^=head1\s+NAME"), ("=head1 DESCRIPTION", r"^=head1\s+DESCRIPTION")] if not re.search(reg, c, re.M)]] if missing for sec_str in [", ".join(missing)]]; [print(e) for e in errors]; sys.exit(1 if errors else 0)'
        language: system
        types:
          - perl
        pass_filenames: true
      - id: perlcritic
        name: perlcritic
        entry: perl -S perlcritic --profile .perlcriticrc
        language: system
        types:
          - perl
        pass_filenames: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
